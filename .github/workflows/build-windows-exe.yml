name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'application/**'
      - 'modules/**'
      - 'resources/**'
      - 'tests/**'
      - 'launch_app.py'
      - 'generate_report.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ChiffresClesMartinique launch_app.py
      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/ChiffresClesMartinique.exe package/
          Copy-Item modules package/modules -Recurse
          New-Item -ItemType Directory -Force -Path package/application | Out-Null
          Copy-Item application/source_registry.json package/application/
          if (Test-Path data) { Copy-Item data package/data -Recurse }
          Copy-Item docs package/docs -Recurse
          Copy-Item resources package/resources -Recurse
          Copy-Item README.md,VERSION,requirements.txt,generate_report.py,update_observatoire.py package/
      - uses: actions/upload-artifact@v4
        with:
          name: ChiffresClesMartinique-Windows
          path: package
